name: Gathern Pricing

on:
  schedule:
    # كل ساعة
    - cron: '0 * * * *'
    # 11:50 مساءً بتوقيت السعودية (20:50 UTC) - وضع الإتاحة التلقائية
    - cron: '50 20 * * *'
  workflow_dispatch:  # تشغيل يدوي من GitHub عند الحاجة

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    env:
      GATHERN_PHONE:      ${{ secrets.GATHERN_PHONE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      NUZUL_PHONE:        ${{ secrets.NUZUL_PHONE }}
      NUZUL_PASSWORD:     ${{ secrets.NUZUL_PASSWORD }}
      MANUAL_RUN:         ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      GB_TOKEN:           ${{ secrets.GB_TOKEN }}
      GB_JWT:             ${{ secrets.GB_JWT }}
      DISPLAY: ':99'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Restore Airbnb session
        uses: actions/cache@v4
        with:
          path: airbnb_session_state.json
          key: airbnb-session-${{ github.run_id }}
          restore-keys: |
            airbnb-session-

      - name: Run pricing tool
        run: python pricing.py

      - name: Save Airbnb session
        uses: actions/cache/save@v4
        if: always()
        with:
          path: airbnb_session_state.json
          key: airbnb-session-${{ github.run_id }}

      - name: Save history data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git merge --no-edit FETCH_HEAD
          git add data/history.csv
          git diff --cached --quiet || git commit -m "data: update history $(date -u '+%Y-%m-%d %H:%M')"
          git push || echo "تحذير: فشل رفع البيانات"
